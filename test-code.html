<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Responsive Header</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50">

<!-- Header -->
<header class="fixed top-0 left-0 w-full bg-white shadow-md z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <!-- Logo -->
        <h1 class="text-2xl font-bold text-blue-600">HereUp</h1>   

        <!-- Menu for Desktop -->
        <nav class="hidden md:flex space-x-8 text-gray-700 font-medium">
            <a href="#home" class="hover:text-blue-600">Home</a>
            <a href="#about" class="hover:text-blue-600">About</a>
            <a href="#features" class="hover:text-blue-600">Features</a>
            <a href="#contact" class="hover:text-blue-600">Contact</a>
        </nav>

        <!-- Hamburger Button -->
        <button id="menu-btn" class="md:hidden">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </div>

        <!-- Mobile Menu -->
        <nav id="mobile-menu" class="hidden md:hidden flex-col bg-white border-t text-gray-700 font-medium">
        <a href="#home" class="py-3 px-6 hover:bg-gray-100">Home</a>
        <a href="#about" class="py-3 px-6 hover:bg-gray-100">About</a>
        <a href="#features" class="py-3 px-6 hover:bg-gray-100">Features</a>
        <a href="#contact" class="py-3 px-6 hover:bg-gray-100">Contact</a>
        </nav>
    </header>

    <!-- Main Content (buat contoh scroll) -->
    <main class="pt-24 px-6">
        <section class="h-[200vh]">
        <h2 class="text-3xl font-semibold mb-4">Content Goes Here</h2>
        <p>Scroll down untuk lihat efek header tetap di atas.</p>
        </section>
    </main>

    <script>
        // Inisialisasi ikon lucide
        lucide.createIcons();

        // Toggle menu di mobile
        const menuBtn = document.getElementById('menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        menuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
